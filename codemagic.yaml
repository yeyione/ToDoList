workflows:
  ionic-ios:
    name: Ionic iOS
    max_build_duration: 120
    environment:
      node: v24.15.0
    scripts:
      - name: Install dependencies
        script: npm install
      - name: Ionic build
        script: ionic build --prod
      - name: Capacitor sync
        script: npx cap sync ios
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      email:
        recipients:
          - jennifer.estradaavendano@gmail.com

